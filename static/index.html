<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seamless Tile Inspector</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Seamless Tile Inspector</h1>
        <p id="status">No image loaded</p>
      </div>
      <button id="refreshHistory" type="button">Refresh history</button>
    </header>

    <main class="workspace">
      <section class="preview-pane" aria-label="Image workspace">
        <div id="dropZone" class="drop-zone" tabindex="0">
          <input id="fileInput" type="file" accept="image/*" hidden />
          <div>
            <strong>Drop tile image</strong>
            <span>or click to select a square PNG/JPEG</span>
          </div>
        </div>

        <div class="stage-grid" id="stageGrid"></div>
      </section>

      <aside class="controls" aria-label="Pipeline parameters">
        <label>
          <span>Mask width <output id="maskWidthValue">60px</output></span>
          <input id="maskWidth" type="range" min="4" max="180" step="2" value="60" />
        </label>

        <fieldset>
          <legend>Model</legend>
          <label><input type="radio" name="model" value="local-preview" checked /> local-preview</label>
          <label><input type="radio" name="model" value="gpt-image-2" /> gpt-image-2</label>
          <label><input type="radio" name="model" value="fal-sdxl" /> fal.ai SDXL</label>
        </fieldset>

        <label>
          <span>Prompt</span>
          <textarea id="prompt" rows="5">preserve the texture and pattern phase across the seam</textarea>
        </label>

        <label>
          <span>Strength <output id="strengthValue">0.70</output></span>
          <input id="strength" type="range" min="0" max="1" step="0.05" value="0.7" />
        </label>

        <button id="runButton" type="button" disabled>Run pipeline</button>

        <section class="history" aria-label="Run history">
          <h2>History</h2>
          <div id="historyList" class="history-list"></div>
        </section>
      </aside>
    </main>

    <section class="compare" aria-label="Selected comparison">
      <h2>Compare</h2>
      <div id="compareGrid" class="compare-grid"></div>
    </section>

    <dialog id="lightbox">
      <button id="closeLightbox" type="button" aria-label="Close">×</button>
      <img id="lightboxImage" alt="" />
      <p id="lightboxCaption"></p>
    </dialog>

    <script src="/app.js" type="module"></script>
  </body>
</html>
